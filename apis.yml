aid: knak
name: Knak
description: >-
  Knak is a no-code email and landing page creation platform built for enterprise marketing
  teams. Marketers design on-brand, responsive emails and landing pages in a drag-and-drop builder, then
  sync the finished HTML directly into their marketing automation platform (Marketo, Eloqua, Salesforce
  Marketing Cloud, Braze, HubSpot and others) without writing code or waiting on developers. For technical
  teams Knak publishes a documented developer surface -- the Knak Enterprise REST API for automating users,
  assets, themes, modules, brands, folders, merge tags and translation requests; the Knak Send Contacts
  API; a SCIM 2.0 API for identity-provider driven user provisioning; signed webhooks for asset and
  translation lifecycle events; a set of customer-implemented integration contracts (Custom DAM, Custom
  Validator, Custom Sync Location); and a hosted, OAuth 2.1 protected MCP server that lets AI clients
  generate and browse Knak assets.
