notes:
- Knak publishes no A2A agent card. /.well-known/agent-card.json and /.well-known/agent.json
  return 404 on enterprise.knak.io, knak.com and developer.knak.com, and the only 200s come
  from the send.knak.io SPA catch-all, which returns an HTML shell for every path. No a2a/
  artifact is written.
- Knak publishes no RFC 9116 security.txt on any probed host, although a responsible
  disclosure process and a security@knak.com contact are documented at https://knak.com/security/.
