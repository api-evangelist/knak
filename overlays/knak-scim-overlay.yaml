    x-apievangelist-observations:
    - Implements SCIM 2.0 at https://enterprise.knak.io/scim/v2 with a /Users resource
      supporting GET, POST, PUT and PATCH. No /Groups resource is published.
    - No operationId is declared on any operation.
    - No securitySchemes are declared, although provisioning requests require a bearer
      token issued in Knak Enterprise.
    - The same users are also readable and deletable through the Enterprise API /users
      endpoints; deletion is available there rather than through SCIM.
    - Single sign-on is delivered over SAML 2.0 rather than OpenID Connect.
