openapi: 3.2.0
info:
  description: '## Overview

    An API specification to provide a Custom Sync Location in Knak.'
  version: V1
  title: Custom API Reference Sync Location API
  x-logo:
    url: https://s3.amazonaws.com/assets.knak.io/img/Knak-Logo-Medium.png
servers:
- url: https://yourService.com/your-sync-location-api
tags:
- name: Sync Location
  description: Endpoints to retrieve Sync Location
paths:
  /v1/knak-sync-location:
    post:
      tags:
      - Sync Location
      summary: Provide Sync Location for Asset
      description: Knak will call this endpoint to get the sync location for the asset. This is used to determine the sync location for the asset in Knak.
      security:
      - OAuth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: The type of the asset
                        example: email
                      id:
                        type: string
                        description: The ID of the asset
                        example: 66154fd1e9704
                      custom_field_example_1:
                        type: string
                        description: Can be any custom field you want to use to determine the sync location
                        example: newsletter
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The type of the asset
                          example: email
                        id:
                          type: string
                          description: The ID of the asset
                          example: 66154fd1e9704
                        folder:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the folder or program
                              example: '1256'
                            title:
                              type: string
                              description: The title of the folder or program
                              example: My Favourite Program
                            is_root:
                              type: boolean
                              description: Whether this is a root folder
                              example: false
                            status:
                              type: string
                              description: The status of the folder or program
                              nullable: true
                              example: null
                            parent_id:
                              type: string
                              description: The ID of the parent folder
                              example: '48'
                            folder_type:
                              type: string
                              description: The type of the folder (Folder or Program)
                              example: Program
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: The type of the asset
                          example: email
                        id:
                          type: string
                          description: The ID of the asset
                          example: 66154fd1e9704
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          description: The error message
                          example: Invalid Custom Field
                        type:
                          type: string
                          description: The type of the error
                          example: invalid
                        level:
                          type: string
                          description: The severity level of the error
                          example: error
                        email_id:
                          type: string
                          description: The ID of the email
                          example: 66154fd1e9704
      operationId: postV1KnakSyncLocation
      x-operation-id-source: derived
